<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>終極港片爭霸戰</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');



        :root {

            --bg-color: #090a0f;

            --neon-pink: #ff007f;

            --neon-blue: #00f0ff;

            --neon-yellow: #f3e600;

            --text-color: #ffffff;

            --card-bg: rgba(18, 20, 32, 0.9);

        }



        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family: 'Noto Sans TC', sans-serif;

        }



        body {

            background-color: var(--bg-color);

            color: var(--text-color);

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow-x: hidden;

            position: relative;

            padding: 20px;

        }



        /* 復古霓虹掃描線背景 */

        body::before {

            content: " ";

            display: block;

            position: absolute;

            top: 0; left: 0; bottom: 0; right: 0;

            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));

            z-index: 999;

            background-size: 100% 4px, 6px 100%;

            pointer-events: none;

        }



        .container {

            width: 100%;

            max-width: 720px;

            z-index: 10;

        }



        .card {

            background: var(--card-bg);

            border: 2px solid var(--neon-blue);

            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.1);

            border-radius: 16px;

            padding: 35px;

            backdrop-filter: blur(10px);

            text-align: center;

            animation: fadeIn 0.4s ease-in-out;

        }



        @keyframes fadeIn {

            from { opacity: 0; transform: translateY(10px); }

            to { opacity: 1; transform: translateY(0); }

        }



        h1 {

            font-size: 2.5rem;

            color: var(--neon-yellow);

            text-shadow: 0 0 10px var(--neon-yellow), 0 0 20px var(--neon-pink);

            margin-bottom: 15px;

            letter-spacing: 2px;

        }



        .rules-box {

            background: rgba(0, 0, 0, 0.4);

            border: 1px dashed var(--neon-pink);

            border-radius: 10px;

            padding: 18px;

            margin: 20px 0;

            text-align: left;

            font-size: 0.95rem;

            line-height: 1.6;

            color: #e2e8f0;

        }



        .rules-box h3 {

            color: var(--neon-pink);

            margin-bottom: 8px;

            text-shadow: 0 0 5px rgba(255, 0, 127, 0.5);

        }



        p {

            font-size: 1.05rem;

            line-height: 1.6;

            margin-bottom: 20px;

            color: #d1d5db;

        }



        .btn {

            background: transparent;

            color: var(--neon-pink);

            border: 2px solid var(--neon-pink);

            padding: 12px 35px;

            font-size: 1.2rem;

            font-weight: 700;

            border-radius: 50px;

            cursor: pointer;

            text-shadow: 0 0 5px var(--neon-pink);

            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);

            transition: all 0.3s ease;

            margin-top: 15px;

        }



        .btn:hover {

            background: var(--neon-pink);

            color: var(--bg-color);

            box-shadow: 0 0 25px var(--neon-pink);

            transform: scale(1.05);

        }



        /* 答題介面樣式 */

        .quiz-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

            font-size: 0.95rem;

            color: var(--neon-blue);

            border-bottom: 1px dashed rgba(255, 255, 255, 0.2);

            padding-bottom: 10px;

        }



        .badge-type {

            background: rgba(0, 240, 255, 0.15);

            color: var(--neon-blue);

            padding: 4px 10px;

            border-radius: 20px;

            font-size: 0.85rem;

            border: 1px solid var(--neon-blue);

        }



        .question-text {

            font-size: 1.25rem;

            font-weight: bold;

            margin-bottom: 20px;

            text-align: left;

            color: #ffffff;

        }



        .options-grid {

            display: flex;

            flex-direction: column;

            gap: 12px;

            margin-bottom: 20px;

        }



        .option-btn {

            background: rgba(255, 255, 255, 0.05);

            color: #ffffff;

            border: 1px solid rgba(255, 255, 255, 0.2);

            padding: 14px 20px;

            font-size: 1.05rem;

            border-radius: 10px;

            cursor: pointer;

            text-align: left;

            transition: all 0.2s ease;

        }



        .option-btn:hover {

            background: rgba(0, 240, 255, 0.15);

            border-color: var(--neon-blue);

            padding-left: 25px;

        }



        /* 填空題輸入框 */

        .text-input-group {

            display: flex;

            flex-direction: column;

            gap: 15px;

            margin-bottom: 20px;

        }



        .text-input {

            background: rgba(0, 0, 0, 0.5);

            border: 2px solid var(--neon-blue);

            padding: 14px 20px;

            font-size: 1.1rem;

            color: #fff;

            border-radius: 10px;

            outline: none;

        }



        .text-input:focus {

            box-shadow: 0 0 10px var(--neon-blue);

        }



        .submit-text-btn {

            background: var(--neon-blue);

            color: var(--bg-color);

            border: none;

            padding: 12px;

            font-size: 1.1rem;

            font-weight: bold;

            border-radius: 10px;

            cursor: pointer;

            transition: 0.2s;

        }



        .submit-text-btn:hover {

            background: #00bcd4;

            box-shadow: 0 0 15px var(--neon-blue);

        }



        /* 結果解析彈窗或區域 */

        .explanation {

            background: rgba(243, 230, 0, 0.1);

            border: 1px solid var(--neon-yellow);

            padding: 12px;

            border-radius: 8px;

            margin-top: 15px;

            font-size: 0.95rem;

            color: var(--neon-yellow);

            text-align: left;

            display: none;

        }



        .next-btn {

            background: var(--neon-yellow);

            color: var(--bg-color);

            border: none;

            padding: 10px 25px;

            font-size: 1rem;

            font-weight: bold;

            border-radius: 30px;

            cursor: pointer;

            margin-top: 15px;

            display: none;

            float: right;

        }



        .next-btn:hover {

            box-shadow: 0 0 15px var(--neon-yellow);

        }



        /* 結算頁樣式 */

        .result-title {

            font-size: 2rem;

            color: var(--neon-yellow);

            margin-bottom: 10px;

            text-shadow: 0 0 10px var(--neon-yellow);

        }



        .score-display {

            font-size: 2.8rem;

            font-weight: 900;

            color: var(--neon-pink);

            text-shadow: 0 0 15px var(--neon-pink);

            margin: 15px 0;

        }



        .result-desc {

            background: rgba(0, 0, 0, 0.4);

            border: 1px solid var(--neon-blue);

            padding: 20px;

            border-radius: 12px;

            margin: 20px 0;

            font-size: 1.1rem;

            line-height: 1.6;

        }

    </style>

</head>

<body>



    <div class="container">

        <!-- 首頁 -->

        <div id="home-screen" class="card">

            <h1>🎬 終極港片爭霸戰</h1>

            <p>測試你是真正的港片戲精，還是只看過賭神？挑戰 30 道港片經典難題！</p>

            

            <div class="rules-box">

                <h3>📌 遊戲規則說明</h3>

                <ul>

                    <li><strong>第 1 ～ 15 題</strong>：選擇題（每題 1 分）</li>

                    <li><strong>第 16 ～ 25 題</strong>：填空／簡答題（每題 3 分）</li>

                    <li><strong>第 26 ～ 30 題</strong>：加分題 Bonus（每題 1 分）</li>

                    <li><strong>總分</strong>：滿分 50 分（基本題 45 分 + 加分題 5 分）</li>

                    <li><strong>範圍</strong>：港片經典台詞、電影細節、經典場景與冷知識</li>

                </ul>

            </div>



            <button class="btn" onclick="startQuiz()">開始挑戰</button>

        </div>



        <!-- 答題頁面 -->

        <div id="quiz-screen" class="card" style="display: none;">

            <div class="quiz-header">

                <span id="question-progress">題目 1 / 30</span>

                <span id="question-type-badge" class="badge-type">選擇題（1分）</span>

            </div>

            <div class="question-text" id="question-text">載入中...</div>

            

            <!-- 選擇題選項容器 -->

            <div id="options-container" class="options-grid"></div>



            <!-- 填空題輸入容器 -->

            <div id="text-input-container" class="text-input-container" style="display: none;">

                <div class="text-input-group">

                    <input type="text" id="user-answer-input" class="text-input" placeholder="請輸入你的答案（例如：總經理、明朝等）">

                    <button class="submit-text-btn" onclick="submitTextAnswer()">送出答案</button>

                </div>

            </div>



            <div id="explanation-box" class="explanation"></div>

            <button id="next-btn" class="next-btn" onclick="nextQuestion()">下一題 ➔</button>

        </div>



        <!-- 結果頁面 -->

        <div id="result-screen" class="card" style="display: none;">

            <h2 class="result-title">🏆 測驗結算結果</h2>

            <div class="score-display" id="final-score">0 / 50 分</div>

            <div class="result-desc" id="result-description">載入中...</div>

            <button class="btn" onclick="restartQuiz()">再玩一次</button>

        </div>

    </div>



    <script>

        const questions = [

            // PART 1｜選擇題（1~15題，每題1分）

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "1. 《唐伯虎點秋香》中，華夫人的天下第一奇毒是？",

                options: ["A. 含笑半步癲", "B. 一日喪命散", "C. 奇銀合歡散", "D. 我愛一條柴"],

                answer: 1,

                explanation: "💡 解析：華夫人介紹自家毒藥，一日喪命散顧名思義，絕不會留命到五更！"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "2. 《賭俠》中小刀打電話給賭神時，賭神人在哪裡？",

                options: ["A. 美國", "B. 香港", "C. 巴西", "D. 澳門"],

                answer: 2,

                explanation: "💡 解析：賭神當時正在巴西度假消遙。"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "3. 《無間道》中，梁朝偉飾演的陳永仁在天台對劉德華說的名台詞是？",

                options: ["A. 其實我是個警察", "B. 以前我沒得選，現在我想做個好人", "C. 對不起，我是警察", "D. 我話講完，誰贊成，誰反對？"],

                answer: 2,

                explanation: "💡 解析：經典的天台名場面，黃金對白流傳至今。"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "4. 《少林足球》中，少林足球正式成軍後，第一場比賽遇到的是哪一隊？",

                options: ["A. 少林羅漢隊", "B. 豆腐金剛隊", "C. 魔鬼隊", "D. 金剛鐵腿隊"],

                answer: 1,

                explanation: "💡 解析：第一場友誼賽就是對上身形魁梧的豆腐金剛隊。"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "5. 《少林足球》中，二師兄、三師兄、四師兄各自是什麼武功？",

                options: [

                    "A. 金鐘罩鐵布衫、旋風地堂腿、鬼影擒拿手",

                    "B. 旋風地堂腿、金鐘罩鐵布衫、鬼影擒拿手",

                    "C. 旋風地堂腿、金鐘罩鐵布衫、鬼影擒拿手",

                    "D. 鬼影擒拿手、金鐘罩鐵布衫、旋風地堂腿"

                ],

                answer: 3,

                explanation: "💡 解析：二師兄鬼影擒拿手（守門員）、三師兄金鐘罩鐵布衫、四師兄旋風地堂腿。"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "6. 《逃學威龍》中，周星馳臥底進入學校要幫高級警司找什麼東西？",

                options: ["A. 消失的考卷", "B. 善良的槍", "C. 毒品交易名冊", "D. 校長的私房錢"],

                answer: 1,

                explanation: "💡 解析：飛虎隊隊長周星星最頭痛的任務就是找那一把弄丟的散彈槍（善良的槍）。"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "7. 《重慶森林》中，金城武飾演的何志武一直在收集什麼日期的鳳梨罐頭？",

                options: ["A. 5月1日", "B. 4月1日", "C. 5月20日", "D. 10/10"],

                answer: 0,

                explanation: "💡 解析：女友阿May在4月1日提出分手，他決定買鳳梨罐頭到5月1日過期作結。"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "8. 《與龍共舞》中，「漂漂教月光的菲律賓減肥法」中，Tuesday 是怎麼吃？",

                options: ["A. 隨便吃", "B. 任你吃", "C. 不准吃", "D. 盡量吃"],

                answer: 1,

                explanation: "💡 解析：經典爆笑台詞：「Tuesday 任你吃！」"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "9. 《大話西遊》中，至尊寶說過那段著名的「如果上天能給我一個再來一次的機會」，是在對誰說？",

                options: ["A. 白晶晶", "B. 紫霞仙子", "C. 春三十娘", "D. 鐵扇公主"],

                answer: 1,

                explanation: "💡 解析：這段台詞成了華語電影史上最經典的愛情遺憾旁白。"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "10. 《唐伯虎點秋香》中，含笑半步癲是用什麼做的？",

                options: [

                    "A. 枇杷，熊掌，桔梗，加上天山雪蓮配製而成",

                    "B. 蜂蜜，川貝，鹿角，加上天山白蓮配製而成",

                    "C. 蜂蜜，川貝，桔梗，加上天山雪蓮配製而成",

                    "D. 蜂蜜，人參，桔梗，加上天山白蓮配製而成"

                ],

                answer: 2,

                explanation: "💡 解析：無三小路用的一日喪命散與含笑半步癲獨家配方。"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "11. 《唐伯虎點秋香》中，在唐伯虎還沒報仇以前，兵器譜上排行第四的是？",

                options: ["A. 小李飛刀他娘", "B. 書生奪命劍", "C. 霸王槍", "D. 小李飛刀"],

                answer: 0,

                explanation: "💡 解析：「小李飛刀他娘的飛刀！」"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "12. 《九品芝麻官》何夫人的房裡有什麼？",

                options: ["A. 山西布政的五千兩", "B. 八府巡撫的五千兩", "C. 山西知縣的五千兩", "D. 廣州知縣的五千兩"],

                answer: 0,

                explanation: "💡 解析：常威跟戚家大少奶奶有一腿的關鍵證物線索。"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "13. 《嚦咕嚦咕新年財》詠琪在片中沒有做過哪個職業？",

                options: ["A. 稅務員", "B. 交通警察", "C. 空姐", "D. 外送員"],

                answer: 3,

                explanation: "💡 解析：劉德華的前女友詠琪在片中換過多種職業造型。"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "14. 《與龍共舞》裡，十三姑在幫王大為律師治療的時候，龍家駿忘了帶毛衣針進箱子，便改用什麼東西造成刺刺的效果？",

                options: ["A. 吹風機", "B. 別針", "C. 大頭針", "D. 筷子"],

                answer: 3,

                explanation: "💡 解析：用筷子克難地在箱子外戳戳戳製造針灸感。"

            },

            {

                type: "choice", points: 1, category: "選擇題（1分）",

                q: "15. 《射鵰英雄傳之東成西就》周伯通對小師妹說，晚上不睡覺又出來假扮誰？",

                options: ["A. 林青霞", "B. 王祖賢", "C. Talklish", "D. 劉嘉玲"],

                answer: 1,

                explanation: "💡 解析：經典搞笑橋段：「三師妹，你又趁晚上不睡覺出來假扮王祖賢啊？」"

            },



            // PART 2｜填空／簡答題（16~25題，每題3分）

            {

                type: "text", points: 3, category: "填空簡答題（每題3分）",

                q: "16. 四個好色的女人中，Frankie 點了首「光棍姻緣」，其中的歌詞是含一個大雪茄，假裝是___？",

                answer: "總經理",

                explanation: "💡 解析：經典搞笑對白與台詞細節。"

            },

            {

                type: "text", points: 3, category: "填空簡答題（每題3分）",

                q: "17. 《大內密探零零漆》裡面，得到最佳男主角獎的是誰？",

                answer: "阿發的岳父",

                explanation: "💡 解析：刑場上那一段荒謬絕倫的頒獎典禮。"

            },

            {

                type: "text", points: 3, category: "填空簡答題（每題3分）",

                q: "18. 《家有喜事》中《醉拳甘迺迪》是什麼的續集？（需答出5個字）",

                answer: "南拳北腿孫中山",

                explanation: "💡 解析：周星馳在錄影帶店瞎掰的電影續集名稱。"

            },

            {

                type: "text", points: 3, category: "填空簡答題（每題3分）",

                q: "19. 《賭俠》中影片最後，周星祖和夢羅還了海珊多少錢？",

                answer: "一塊兩毛五",

                explanation: "💡 解析：最後大反高潮的搞笑結尾帳目。"

            },

            {

                type: "text", points: 3, category: "填空簡答題（每題3分）",

                q: "20. 在《九品芝麻官》中，星爺的老媽說尚方寶劍是誰賜的？（可填朝代或皇帝名）",

                answer: ["明朝", "崇禎皇帝", "崇禎"],

                explanation: "💡 解析：結果拿出來發現是前朝（明朝）尚方寶劍斬本朝（清朝）官員。"

            },

            {

                type: "text", points: 3, category: "填空簡答題（每題3分）",

                q: "21. 《摩登如來神掌》中，天殘說「大俠才吃漢堡包，你不是大俠，吃__」，最後是叫他吃什麼？",

                answer: "香蕉",

                explanation: "💡 解析：元華飾演的天殘經典反派台詞。"

            },

            {

                type: "text", points: 3, category: "填空簡答題（每題3分）",

                q: "22. 由鄭伊健與鍾麗緹主演的《人魚傳說》中，人魚小美一直想要阿志帶她去吃什麼？",

                answer: "辣椒炒海瓜子",

                explanation: "💡 解析：人魚對陸地美食的獨特執念。"

            },

            {

                type: "text", points: 3, category: "填空簡答題（每題3分）",

                q: "23. 時光倒流的月光寶盒要喊什麼咒語？",

                answer: "般若波羅蜜",

                explanation: "💡 解析：經典穿越咒語：「波若波羅蜜！」"

            },

            {

                type: "text", points: 3, category: "填空簡答題（每題3分）",

                q: "24. 《破壞之王》中，何金銀（周星馳）為了追求阿麗，使出了什麼必殺絕技？",

                answer: "無敵風火輪",

                explanation: "💡 解析：從階梯一路滾下去的搏命浪漫。"

            },

            {

                type: "text", points: 3, category: "填空簡答題（每題3分）",

                q: "25. 屍家重地大BOSS殭屍是誰？",

                answer: "秦始皇",

                explanation: "💡 解析：香港經典搞笑恐怖片中復活的千古一帝。"

            },



            // PART 3｜加分題 Bonus（26~30題，每題1分）

            {

                type: "choice", points: 1, category: "加分題 Bonus（每題1分）",

                q: "26. 《我的左眼見到鬼》裡，女主角跟前任老公才認識幾天就結婚？",

                options: ["A. 3天", "B. 7天", "C. 14天", "D. 30天"],

                answer: 1,

                explanation: "💡 解析：鄭秀文主演的浪漫鬼片經典細節。"

            },

            {

                type: "choice", points: 1, category: "加分題 Bonus（每題1分）",

                q: "27. 《富貴再逼人》中的彩券是哪一國的彩券？",

                options: ["A. 美國", "B. 英國", "C. 加拿大", "D. 香港"],

                answer: 2,

                explanation: "💡 解析：一家人中了大筆加拿大彩券獎金引發連串笑話。"

            },

            {

                type: "choice", points: 1, category: "加分題 Bonus（每題1分）",

                q: "28. 電影《超級學校霸王》演出陣容眾星雲集，以下誰沒有在電影中有任何身影的露出？",

                options: ["A. 任達華", "B. 許志安", "C. 周星馳", "D. 黎明"],

                answer: 3,

                explanation: "💡 解析：四大天王缺了黎明，其他三位與眾多巨星齊聚一堂。"

            },

            {

                type: "choice", points: 1, category: "加分題 Bonus（每題1分）",

                q: "29. 與龍共舞裡十一姑在大嶼山的雜貨店，可能是現在香港的哪裡？",

                options: ["A. 香港迪士尼樂園", "B. 尖沙咀海濱星光大道", "C. 西貢郊野公園", "D. 香港海洋公園"],

                answer: 0,

                explanation: "💡 解析：電影中取景地後來變成了香港迪士尼樂園所在地。"

            },

            {

                type: "choice", points: 1, category: "加分題 Bonus（每題1分）",

                q: "30. 香港電影在經歷了 1980 至 1990 年代「東方荷里活」的輝煌黃金時期後，逐漸走向沒落，下列哪一個「不是」香港電影可能沒落的原因？",

                options: [

                    "A. 過度迎合中國大陸市場與嚴格審查，導致本土特色流失",

                    "B. 台灣及東南亞等重要海外市場流失，加上盜版猖獗",

                    "C. 電影工業人才斷層嚴重，中生代及新導演未能順利接棒",

                    "D. 本土影院過剩導致票價崩盤，使得電影公司資金過度浮濫"

                ],

                answer: 3,

                explanation: "💡 解析：選項D與歷史事實相反，當時面臨的是戲院減少、盜版與外資撤出等衝擊。"

            }

        ];



        let currentIdx = 0;

        let totalScore = 0;

        let selectedOption = null;



        function startQuiz() {

            document.getElementById('home-screen').style.display = 'none';

            document.getElementById('quiz-screen').style.display = 'block';

            currentIdx = 0;

            totalScore = 0;

            loadQuestion();

        }



        function loadQuestion() {

            resetState();

            const q = questions[currentIdx];

            document.getElementById('question-progress').innerText = `題目 ${currentIdx + 1} / 30`;

            document.getElementById('question-type-badge').innerText = q.category;

            document.getElementById('question-text').innerText = q.q;



            if (q.type === 'choice') {

                document.getElementById('options-container').style.display = 'flex';

                document.getElementById('text-input-container').style.display = 'none';

                

                const container = document.getElementById('options-container');

                q.options.forEach((opt, idx) => {

                    const btn = document.createElement('button');

                    btn.className = 'option-btn';

                    btn.innerText = opt;

                    btn.onclick = () => selectChoice(idx);

                    container.appendChild(btn);

                });

            } else {

                document.getElementById('options-container').style.display = 'none';

                document.getElementById('text-input-container').style.display = 'block';

                document.getElementById('user-answer-input').value = '';

            }

        }



        function resetState() {

            selectedOption = null;

            document.getElementById('options-container').innerHTML = '';

            document.getElementById('explanation-box').style.display = 'none';

            document.getElementById('next-btn').style.display = 'none';

        }



        function selectChoice(idx) {

            const q = questions[currentIdx];

            const buttons = document.querySelectorAll('.option-btn');

            

            buttons.forEach((b, i) => {

                b.disabled = true;

                if (i === q.answer) {

                    b.style.background = 'rgba(0, 255, 100, 0.25)';

                    b.style.borderColor = '#00ff64';

                } else if (i === idx) {

                    b.style.background = 'rgba(255, 0, 100, 0.25)';

                    b.style.borderColor = '#ff0064';

                }

            });



            if (idx === q.answer) {

                totalScore += q.points;

            }



            showExplanation(q.explanation);

        }



        function submitTextAnswer() {

            const userInput = document.getElementById('user-answer-input').value.trim();

            if (!userInput) {

                alert('請輸入答案！');

                return;

            }



            const q = questions[currentIdx];

            let isCorrect = false;



            if (Array.isArray(q.answer)) {

                isCorrect = q.answer.some(ans => userInput.includes(ans));

            } else {

                isCorrect = userInput.includes(q.answer);

            }



            if (isCorrect) {

                totalScore += q.points;

                document.getElementById('user-answer-input').style.borderColor = '#00ff64';

            } else {

                document.getElementById('user-answer-input').style.borderColor = '#ff0064';

            }



            document.querySelector('.submit-text-btn').disabled = true;

            document.getElementById('user-answer-input').disabled = true;



            let resultMsg = isCorrect ? `✅ 答對了！（+${q.points}分）<br>` : `❌ 答錯了！正確答案是：${Array.isArray(q.answer) ? q.answer[0] : q.answer}<br>`;

            showExplanation(resultMsg + q.explanation);

        }



        function showExplanation(text) {

            const expBox = document.getElementById('explanation-box');

            expBox.innerHTML = text;

            expBox.style.display = 'block';

            document.getElementById('next-btn').style.display = 'block';

        }



        function nextQuestion() {

            currentIdx++;

            if (currentIdx < questions.length) {

                loadQuestion();

            } else {

                showResult();

            }

        }



        function showResult() {

            document.getElementById('quiz-screen').style.display = 'none';

            document.getElementById('result-screen').style.display = 'block';

            document.getElementById('final-score').innerText = `${totalScore} / 50 分`;



            let title = "";

            let desc = "";



            if (totalScore >= 45) {

                title = "👑 港片之王";

                desc = "你不是在看港片，你是活在港片裡！台詞、冷門細節、甚至道具編號都難不倒你，全場請起立膜拜！";

            } else if (totalScore >= 35) {

                title = "🔥 港片大師";

                desc = "經典台詞跟細節掌握得非常不錯！對黃金年代的香港電影瞭若指掌，絕對是資深港片迷。";

            } else if (totalScore >= 25) {

                title = "😎 港片熟客";

                desc = "知道不少經典名場面與巨星作品，但碰到一些深水區的冷門細節還是不小心滑鐵盧了，週末快去補課！";

            } else if (totalScore >= 15) {

                title = "🍿 港片觀眾";

                desc = "有看過，但可能都是「朋友播什麼你看什麼」，或是第四台轉到瞄幾眼，基礎題有拿穩，填空題要加油囉！";

            } else {

                title = "🥲 港片路人";

                desc = "你是否剛出獄！？連這些經典台詞跟橋段都答不出來，今晚罰你把周星馳電影全集重刷三遍！";

            }



            document.getElementById('result-description').innerHTML = `<strong>${title}</strong><br><br>${desc}`;

        }



        function restartQuiz() {

            document.getElementById('result-screen').style.display = 'none';

            document.getElementById('home-screen').style.display = 'block';

        }

    </script>
